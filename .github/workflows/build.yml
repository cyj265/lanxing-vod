name: 构建揽星影视 APK

permissions:
  contents: write

on:
  push:
    branches: [ main, dev-5.6.1 ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python 3.10（chaquopy 构建 Python 运行时需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Gradle（缓存发行版与依赖，避免重复下载超时）
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 Android SDK 环境
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 安装 Android SDK（platform-37 预览版 + build-tools）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --channel=3 "platforms;android-37" || echo "platform-37 预装失败，将由 AGP 自动下载兜底"
          yes | sdkmanager "build-tools;36.0.0" || echo "build-tools 预装失败，将由 AGP 自动下载兜底"

      - name: 写入签名配置（从 Secrets 读取）
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "${{ secrets.LANXING_KEYSTORE_B64 }}" | base64 -d > lanxing.keystore
          echo "storeFile=${{ github.workspace }}/lanxing.keystore" >> local.properties
          echo "keyAlias=${{ secrets.LANXING_KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.LANXING_STORE_PASSWORD }}" >> local.properties

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon --console=plain > /tmp/gradle-build.log 2>&1
          code=$?
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            echo "BUILD OK"
            echo "APK_PATH=$APK" >> $GITHUB_ENV
            ls -la "$APK"
          else
            echo "::error::构建失败(exit=$code)，APK未生成。最后200行日志："
            tail -200 /tmp/gradle-build.log
            exit 1
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 揽星影视-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "prefix=$(echo "$VERSION" | sed 's/\.[0-9]*$//')" >> $GITHUB_OUTPUT

      - name: 上传 Bugly 符号表（mapping）
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.BUGLY_APP_KEY }}" ]; then
            echo "未配置 BUGLY_APP_KEY，跳过 mapping 上传"
            exit 0
          fi
          echo "下载 Bugly 符号表上传工具..."
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://bugly.qq.com/v2/downloads" \
            -o /tmp/bugly-symbol-tool.zip \
            "https://bugly.qq.com/v2/sdk?id=d796e9d7-0423-422f-9eb9-63b6e16ef4f9" || { echo "下载失败，跳过"; exit 0; }
          unzip -q -o /tmp/bugly-symbol-tool.zip -d /tmp/bugly-symbol-tool/ || { echo "解压失败，跳过"; exit 0; }
          JAR=$(find /tmp/bugly-symbol-tool -name "buglyqq-upload-symbol.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "未找到 buglyqq-upload-symbol.jar，跳过"
            exit 0
          fi
          echo "上传 mapping v${{ steps.ver.outputs.name }} 到 Bugly..."
          java -jar "$JAR" \
            -appid 69e90fd596 \
            -appkey "${{ secrets.BUGLY_APP_KEY }}" \
            -version "${{ steps.ver.outputs.name }}" \
            -platform Android \
            -inputMapping app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt 2>&1 | tail -15
          echo "Bugly mapping 上传完成"

      - name: 发布 GitHub Release（dev 分支为预发布测试版，不影响对外正式版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 揽星影视 v${{ steps.ver.outputs.name }}
          body: |
            测试版自动构建发布
            更新内容见仓库提交记录
          files: |
            ${{ env.APK_PATH }}
            app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt
          generate_release_notes: false
          fail_on_unmatched_files: false
          overwrite: true
          prerelease: true

      - name: 清理旧 Release（只清理与本分支同系列，保留 main 分支正式版）
        run: |
          PREFIX="v${{ steps.ver.outputs.prefix }}"
          echo "本次系列: ${PREFIX}.x"
          tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E "^${PREFIX}\." | tail -n +3)
          if [ -z "$tags" ]; then
            echo "没有需要清理的同系列旧 release"
          fi
          for tag in $tags; do
            echo "删除同系列旧 release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ github.token }}
