name: 构建揽星影视 APK

permissions:
  contents: write

on:
  push:
    branches: [ main, dev-5.6.1 ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python 3.10（chaquopy 构建 Python 运行时需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Gradle（缓存发行版与依赖，避免重复下载超时）
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 Android SDK 环境
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 安装 Android SDK（platform-37 预览版 + build-tools）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --channel=3 "platforms;android-37" || echo "platform-37 预装失败，将由 AGP 自动下载兜底"
          yes | sdkmanager "build-tools;36.0.0" || echo "build-tools 预装失败，将由 AGP 自动下载兜底"

      - name: 写入签名配置（从 Secrets 读取）
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "${{ secrets.LANXING_KEYSTORE_B64 }}" | base64 -d > lanxing.keystore
          echo "storeFile=${{ github.workspace }}/lanxing.keystore" >> local.properties
          echo "keyAlias=${{ secrets.LANXING_KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.LANXING_STORE_PASSWORD }}" >> local.properties

      - name: 构建 release APK（手机版 + 电视版，均 64 位）
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleMobileArm64_v8aRelease :app:assembleLeanbackArm64_v8aRelease --no-daemon --console=plain > /tmp/gradle-build.log 2>&1
          code=$?
          MOBILE_APK=$(find app/build/outputs/apk/mobileArm64_v8a/release -name "*.apk" | head -1)
          TV_APK=$(find app/build/outputs/apk/leanbackArm64_v8a/release -name "*.apk" | head -1)
          if [ -n "$MOBILE_APK" ] && [ -f "$MOBILE_APK" ] && [ -n "$TV_APK" ] && [ -f "$TV_APK" ]; then
            echo "BUILD OK"
            version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
            mkdir -p /tmp/lx-release
            # 命名沿用 main 正式版逻辑：文件名带版本号(不用构建号)，防缓存串版本
            cp "$MOBILE_APK" "/tmp/lx-release/lanxing-v${version}.apk"
            cp "$TV_APK" "/tmp/lx-release/lanxing-tv-v${version}.apk"
            ls -la /tmp/lx-release
            echo "APK_PATH=/tmp/lx-release" >> $GITHUB_ENV
          else
            echo "::error::构建失败(exit=$code)，APK未生成。最后200行日志："
            tail -200 /tmp/gradle-build.log
            exit 1
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 揽星影视-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "prefix=$(echo "$VERSION" | sed 's/\.[0-9]*$//')" >> $GITHUB_OUTPUT

      - name: 上传 Bugly 符号表（mapping，手机版 + 电视版）
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.BUGLY_APP_KEY }}" ]; then
            echo "未配置 BUGLY_APP_KEY，跳过 mapping 上传"
            exit 0
          fi
          echo "下载 Bugly 符号表上传工具..."
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://bugly.qq.com/v2/downloads" \
            -o /tmp/bugly-symbol-tool.zip \
            "https://bugly.qq.com/v2/sdk?id=d796e9d7-0423-422f-9eb9-63b6e16ef4f9" || { echo "下载失败，跳过"; exit 0; }
          unzip -q -o /tmp/bugly-symbol-tool.zip -d /tmp/bugly-symbol-tool/ || { echo "解压失败，跳过"; exit 0; }
          JAR=$(find /tmp/bugly-symbol-tool -name "buglyqq-upload-symbol.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "未找到 buglyqq-upload-symbol.jar，跳过"
            exit 0
          fi
          for VARIANT in mobileArm64_v8a leanbackArm64_v8a; do
            MAP="app/build/outputs/mapping/${VARIANT}Release/mapping.txt"
            if [ -f "$MAP" ]; then
              echo "上传 mapping($VARIANT) v${{ steps.ver.outputs.name }} 到 Bugly..."
              java -jar "$JAR" \
                -appid 69e90fd596 \
                -appkey "${{ secrets.BUGLY_APP_KEY }}" \
                -version "${{ steps.ver.outputs.name }}" \
                -platform Android \
                -inputMapping "$MAP" 2>&1 | tail -15
            fi
          done
          echo "Bugly mapping 上传完成"

      - name: 清理同版本号旧 Release（正式版 tag 与历史测试版 -r* 一并清理，避免同版本号重复发布）
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          echo "本次正式版 tag: ${TAG}"
          TAGS=$(gh release list --limit 100 --jq '.[].tagName' 2>/dev/null)
          FOUND="$TAG"
          for t in $TAGS; do
            case "$t" in
              "${TAG}"-r[0-9]*) FOUND="$FOUND $t" ;;
            esac
          done
          for t in $FOUND; do
            if gh release view "$t" >/dev/null 2>&1; then
              echo "删除旧 Release: $t"
              gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
            else
              echo "跳过（不存在）: $t"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 发布 GitHub Release（正式版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 揽星影视 v${{ steps.ver.outputs.name }}
          body: |
            ## 揽星影视 v${{ steps.ver.outputs.name }}（正式版）

            **手机版** `lanxing-v${{ steps.ver.outputs.name }}.apk`
            **电视版** `lanxing-tv-v${{ steps.ver.outputs.name }}.apk`

            ### 本次更新
            - 设计语言全盘统一：暗色底 + 圆角表面 + 唯一强调色（薄荷青绿），全应用选中态/描边/进度统一
            - 弹窗容器与标题风格统一，点播设置弹窗紧凑化（音效精简为常用 5 项，其余收进「音效调节」）
            - 修复在线更新误下电视版 APK（更新检测优先选手机版包）
            - 修复应用内更新检测失效（改用版本号判断，构建号方案已废弃）

            更新内容见仓库提交记录。
          files: |
            /tmp/lx-release/lanxing-v${{ steps.ver.outputs.name }}.apk
            /tmp/lx-release/lanxing-tv-v${{ steps.ver.outputs.name }}.apk
            app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt
            app/build/outputs/mapping/leanbackArm64_v8aRelease/mapping.txt
          generate_release_notes: false
          fail_on_unmatched_files: false
          overwrite_files: true

      # 只清理同系列最早的两个之外的旧 release，始终保留最近 2 个（正式版 + 上一个），main 的 5.4.x 不受影响
      - name: 清理旧 Release
        run: |
          PREFIX="v${{ steps.ver.outputs.prefix }}"
          echo "本次系列: ${PREFIX}.x"
          # 注意：--jq '.[].tagName' 输出裸字符串；若用 --json name --jq 会带引号，导致下面的行首匹配全部落空
          tags=$(gh release list --limit 100 --jq '.[].tagName' | grep -E "^${PREFIX}\." | tail -n +3)
          if [ -z "$tags" ]; then
            echo "没有需要清理的同系列旧 release"
          fi
          for tag in $tags; do
            echo "删除同系列旧 release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ github.token }}
