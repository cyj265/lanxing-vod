name: 构建揽星影视 APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Python 3.10（chaquopy 构建 Python 运行时需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Gradle（缓存发行版与依赖，避免重复下载超时）
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 Android SDK 环境
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 安装 platform-36 + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 写入签名配置（从 Secrets 读取）
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "${{ secrets.LANXING_KEYSTORE_B64 }}" | base64 -d > lanxing.keystore
          echo "storeFile=${{ github.workspace }}/lanxing.keystore" >> local.properties
          echo "keyAlias=${{ secrets.LANXING_KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.LANXING_STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.LANXING_KEY_PASSWORD }}" >> local.properties

      - name: 构建 release APK
        run: |
          set +e
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon --console=plain > /tmp/gradle-build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 -c '
          import re
          lines=open("/tmp/gradle-build.log",encoding="utf-8",errors="ignore").read().splitlines()
          keys=[l for l in lines if re.search(r"(?i)(error|FAILED|what went wrong|Execution failed|Caused by|Cannot|Could not|No such|not found|> Task)",l)]
          body="\n".join(keys[-80:]) if keys else "\n".join(lines[-150:])
          body=body.replace("%","%25").replace("\r","").replace("\n","%0A").replace(":","%3A")
          print("::error title=GradleBuildFailed::"+body[:6000])
          '
            exit $code
          fi
          echo "BUILD OK"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 揽星影视-release
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk
          if-no-files-found: error

      - name: 读取版本号
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> $GITHUB_OUTPUT

      - name: 重命名 APK（文件名带版本号，防缓存串版本）
        run: |
          cp app/build/outputs/apk/mobileArm64_v8a/release/mobile-arm64_v8a.apk app/build/outputs/apk/mobileArm64_v8a/release/mobile-arm64_v8a_${{ steps.ver.outputs.name }}.apk
          cp app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt app/build/outputs/apk/mobileArm64_v8a/release/mapping_${{ steps.ver.outputs.name }}.txt 2>/dev/null || echo "mapping not found"

      - name: 上传 mapping 到 Bugly（崩溃堆栈自动还原）
        env:
          BUGLY_APP_KEY: ${{ secrets.BUGLY_APP_KEY }}
        run: |
          if [ -z "$BUGLY_APP_KEY" ]; then
            echo "未配置 BUGLY_APP_KEY，跳过 mapping 上传"
            exit 0
          fi
          echo "下载 Bugly 符号表上传工具..."
          curl -sL -o /tmp/bugly-symbol-tool.zip "https://bugly.qq.com/v2/sdk?id=d796e9d7-0423-422f-9eb9-63b6e16ef4f9"
          unzip -q -o /tmp/bugly-symbol-tool.zip -d /tmp/bugly-symbol-tool/
          JAR=$(find /tmp/bugly-symbol-tool -name "buglyqq-upload-symbol.jar" | head -1)
          echo "上传 mapping v${{ steps.ver.outputs.name }} 到 Bugly..."
          java -jar "$JAR" \
            -appid 69e90fd596 \
            -appkey "$BUGLY_APP_KEY" \
            -bundleid com.cyj265.lanxingvod \
            -version "${{ steps.ver.outputs.name }}" \
            -platform Android \
            -mapping app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt 2>&1 | tail -5
          echo "Bugly mapping 上传完成"

      - name: 删除旧 Release 资产（同名 tag 时覆盖旧 APK）
        run: |
          tag="v${{ steps.ver.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，删除旧资产后重新上传"
            gh release delete-asset "$tag" "mobile-arm64_v8a_${{ steps.ver.outputs.name }}.apk" -y 2>/dev/null || true
            gh release delete-asset "$tag" "mapping_${{ steps.ver.outputs.name }}.txt" -y 2>/dev/null || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 发布 GitHub Release（app 内一键更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: 揽星影视 v${{ steps.ver.outputs.name }}
          body: |
            自动构建发布
            更新内容见仓库提交记录
          files: |
            app/build/outputs/apk/mobileArm64_v8a/release/mobile-arm64_v8a_${{ steps.ver.outputs.name }}.apk
            app/build/outputs/apk/mobileArm64_v8a/release/mapping_${{ steps.ver.outputs.name }}.txt
          generate_release_notes: false
          fail_on_unmatched_files: false

      - name: 清理旧 Release（只保留最新2个）
        run: |
          releases=$(gh release list --limit 100 --json tagName --jq '.[2:].[].tagName')
          for tag in $releases; do
            echo "删除旧 release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GH_TOKEN: ${{ github.token }}
