name: 构建揽星影视 APK

permissions:
  contents: write

on:
  push:
    branches: [ main, dev-5.6.1 ]
    paths-ignore:
      - 'README.md'
      # 改忽略规则/文档不会改变 APK 产物，不必白跑一轮构建
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python 3.10（chaquopy 构建 Python 运行时需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Gradle（缓存发行版与依赖，避免重复下载超时）
        uses: gradle/actions/setup-gradle@v4

      - name: 设置 Android SDK 环境
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: 安装 Android SDK（platform-37 预览版 + build-tools）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --channel=3 "platforms;android-37" || echo "platform-37 预装失败，将由 AGP 自动下载兜底"
          yes | sdkmanager "build-tools;36.0.0" || echo "build-tools 预装失败，将由 AGP 自动下载兜底"

      - name: 写入签名配置（从 Secrets 读取）
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "${{ secrets.LANXING_KEYSTORE_B64 }}" | base64 -d > lanxing.keystore
          echo "storeFile=${{ github.workspace }}/lanxing.keystore" >> local.properties
          echo "keyAlias=${{ secrets.LANXING_KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.LANXING_STORE_PASSWORD }}" >> local.properties

      - name: 构建 release APK（手机版，64 位）
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
        run: |
          chmod +x gradlew
          set +e
          # 只构建手机版：电视版(leanback)已停发，构建链与维护重心全在手机版
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon --console=plain > /tmp/gradle-build.log 2>&1
          code=$?
          MOBILE_APK=$(find app/build/outputs/apk/mobileArm64_v8a/release -name "*.apk" | head -1)
          if [ -n "$MOBILE_APK" ] && [ -f "$MOBILE_APK" ]; then
            echo "BUILD OK"
            version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
            mkdir -p /tmp/lx-release
            # 命名沿用 main 正式版逻辑：文件名带版本号(不用构建号)，防缓存串版本
            # 命名沿用 5.4.44 的 arm64_v8a 标识 + 版本号（不用构建号，防缓存串版本）。
            # 文件名必须带 arm64：5.4.x 老包的更新逻辑只认「文件名含 arm64 的 apk」，
            # 老用户从 5.4 直接升 5.6 时才能取到下载链接。
            cp "$MOBILE_APK" "/tmp/lx-release/lanxing-arm64_v8a-v${version}.apk"
            ls -la /tmp/lx-release
            echo "APK_PATH=/tmp/lx-release" >> $GITHUB_ENV
          else
            echo "::error::构建失败(exit=$code)，APK未生成。最后200行日志："
            tail -200 /tmp/gradle-build.log
            exit 1
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 揽星影视-release
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: 上传 Bugly 符号表（mapping，手机版）
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.BUGLY_APP_KEY }}" ]; then
            echo "未配置 BUGLY_APP_KEY，跳过 mapping 上传"
            exit 0
          fi
          echo "下载 Bugly 符号表上传工具..."
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://bugly.qq.com/v2/downloads" \
            -o /tmp/bugly-symbol-tool.zip \
            "https://bugly.qq.com/v2/sdk?id=d796e9d7-0423-422f-9eb9-63b6e16ef4f9" || { echo "下载失败，跳过"; exit 0; }
          unzip -q -o /tmp/bugly-symbol-tool.zip -d /tmp/bugly-symbol-tool/ || { echo "解压失败，跳过"; exit 0; }
          JAR=$(find /tmp/bugly-symbol-tool -name "buglyqq-upload-symbol.jar" | head -1)
          if [ -z "$JAR" ]; then
            echo "未找到 buglyqq-upload-symbol.jar，跳过"
            exit 0
          fi
          # 只传手机版：电视版停发后不再产出 leanback 变体，也不会有同名 mapping 冲突
          for VARIANT in mobileArm64_v8a; do
            MAP="app/build/outputs/mapping/${VARIANT}Release/mapping.txt"
            if [ -f "$MAP" ]; then
              echo "上传 mapping($VARIANT) v${{ steps.ver.outputs.name }} 到 Bugly..."
              java -jar "$JAR" \
                -appid 69e90fd596 \
                -appkey "${{ secrets.BUGLY_APP_KEY }}" \
                -version "${{ steps.ver.outputs.name }}" \
                -platform Android \
                -inputMapping "$MAP" 2>&1 | tail -15
            fi
          done
          echo "Bugly mapping 上传完成"

      - name: 清理旧 Release（只保留最新 2 条正式版）
        continue-on-error: true
        run: |
          set +e
          TAG="v${{ steps.ver.outputs.name }}"
          # 直接走 REST API：runner 上的 gh CLI 在清理步骤里取不到 release 列表（返回空），会漏删
          RAW=$(curl -s --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100")
          LIST=$(echo "$RAW" | python3 -c "import json,sys; print('\n'.join('%s|%s' % (r['tag_name'], r['id']) for r in json.load(sys.stdin)))")
          echo "线上现有: $(echo $LIST | tr ' ' '\n' | wc -l) 条"
          OTHERS=$(echo "$LIST" | cut -d'|' -f1 | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v -E "^${TAG}$" | grep -v -E '^v5\.4\.' | sort -Vr | head -2)
          KEEP=$(printf '%s\n%s\n' "$TAG" "$OTHERS")
          echo "本次发布: ${TAG}"
          printf '准备保留: '; printf '%s ' "$KEEP"; echo
          for row in $LIST; do
            t=${row%|*}; id=${row#*|}
            if printf '%s\n' "$KEEP" | grep -qx "$t"; then
              echo "保留: $t"
            else
              echo "删除: $t (id=$id)"
              curl -s -X DELETE --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -w "  http=%{http_code}\n" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$id"
            fi
          done
          echo "清理结束"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 发布 GitHub Release（正式版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          # 必须显式锚定到本次构建的 commit：softprops 不传该参数时 GitHub 会用仓库默认分支
          # （main）建 tag，导致在 dev 分支发布时 tag 指向 main，Release 源码包拿不到本次修复
          target_commitish: ${{ github.sha }}
          name: 揽星影视 v${{ steps.ver.outputs.name }}
          body: |
            **手机版** `lanxing-arm64_v8a-v${{ steps.ver.outputs.name }}.apk`

            系统要求：Android 7.0（API 24）及以上。5.4.x 检查更新可直接覆盖安装。
            电视版(leanback)已停止维护并停发：包名签名不变，已装的电视版直接覆盖安装手机版即可，
            数据与配置全部保留。

            更新内容详见仓库提交记录：https://github.com/cyj265/lanxing-vod/commits/${{ github.ref_name }}
          files: |
            /tmp/lx-release/lanxing-arm64_v8a-v${{ steps.ver.outputs.name }}.apk
            app/build/outputs/mapping/mobileArm64_v8aRelease/mapping.txt
          generate_release_notes: false
          fail_on_unmatched_files: false
          overwrite_files: true

      # 发布前先清场（5.4 线已停更、全部并入 5.6）：
      #   1) 删除所有 5.4.x 老包；2) 删除 -r* 测试版；3) 其余只保留版本号最新的 2 条正式版
      # 注意：清理失败一律不阻断发布（--cleanup-tag 可能因 tag 被引用失败），用 set +e + continue-on-error 兜底
