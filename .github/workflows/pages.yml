name: Publish website to GitHub Pages

on:
  push:
    # 原写 [fongmi]，但该分支在本仓库从未存在过，推 website 永远不会触发，站点只能靠手动 dispatch。
    # 只留 dev-5.6.1：网站内容只存在于这条分支（main 上还没有 pages.yml 与 website/），
    # 推 main 根本匹配不到 workflow，列了也是空跑。
    branches: [dev-5.6.1]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    permissions:
      contents: read
      # configure-pages 要用 token 查询/写入 Pages 配置，只读会让它在开头就 403 失败
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
