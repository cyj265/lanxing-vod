name: doh-test
on:
  push:
    paths:
      - '.github/workflows/doh-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test 12 DoH services
        run: |
          declare -a SVC=(ali tencent 360 onedns cloudflare google quad9 adguard dnswatch nextdns controld)
          declare -A URL=(
            [ali]="https://dns.alidns.com/resolve?name=%s&type=A"
            [tencent]="https://doh.pub/dns-query?name=%s&type=A"
            [360]="https://doh.360.cn/dns-query?name=%s&type=A"
            [onedns]="https://doh.onedns.net/dns-query?name=%s&type=A"
            [cloudflare]="https://cloudflare-dns.com/dns-query?name=%s&type=A"
            [google]="https://dns.google/resolve?name=%s&type=A"
            [quad9]="https://dns.quad9.net/dns-query?name=%s&type=A"
            [adguard]="https://dns.adguard-dns.com/dns-query?name=%s&type=A"
            [dnswatch]="https://dns.ryansheats.com/dns-query?name=%s&type=A"
            [nextdns]="https://dns.nextdns.io/dns-query?name=%s&type=A"
            [controld]="https://dns.controld.com/dns-query?name=%s&type=A"
          )
          for d in frodo.douban.com github.com; do
            echo "===== $d ====="
            for k in "${SVC[@]}"; do
              url=$(printf "${URL[$k]}" "$d")
              t0=$(date +%s%3N)
              body=$(curl -s -m 8 -H "accept: application/dns-json" "$url" || true)
              t1=$(date +%s%3N)
              ms=$((t1-t0))
              ips=$(printf '%s' "$body" | python3 -c "
import sys,json
try:
  j=json.load(sys.stdin)
  a=[x['data'] for x in j.get('Answer',[]) if x.get('type')==1]
  print(','.join(a) if a else 'NO_A')
except Exception:
  print('FAIL')
")
              printf "%-12s %4dms %s\n" "$k" "$ms" "$ips"
            done
          done
