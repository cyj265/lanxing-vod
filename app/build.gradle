import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
    id 'com.android.application'
}

apply plugin: 'com.android.application'

static def getGitVersion() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--always'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.cyj265.lanxingvod"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 601
        versionName "5.6.19"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            storeFile = rootProject.file('lanxing-release.keystore')
            storePassword = System.getenv('LANXING_STORE_PASSWORD') ?: 'lanxing'
            keyAlias = System.getenv('LANXING_KEY_ALIAS') ?: 'lanxing'
            keyPassword = System.getenv('LANXING_KEY_PASSWORD') ?: 'lanxing'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager
    implementation libs.androidx.work
    implementation libs.androidx.room
    implementation libs.androidx.lifecycle
    implementation libs.google.material
    implementation libs.google.exoplayer
    implementation libs.google.gson
    implementation libs.github.glide
    implementation libs.github.okhttp
    implementation libs.github.jsoup
    implementation libs.jiayu.thunder
    implementation libs.tencent.bugly
    implementation libs.tencent.buglynative
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation project(':ijkplayer')
}
